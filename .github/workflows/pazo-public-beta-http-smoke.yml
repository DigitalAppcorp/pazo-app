name: PAZO Public Beta HTTPS PWA Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-public-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check public canonical SPA, callbacks, manifest, worker and icons
        run: node scripts/f16-public-pwa-http-gate.mjs
