name: F16 gradual Live isolated implementation gates
on:
  pull_request:
    branches: [main, f17/beta-final-mobile-support-admin-20261022]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gradual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gradual-pg17-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Actual versioned migration, rollback rehearsal, security, failure recovery and concurrency
        run: npm run test:gradual:pg17
      - name: Verify hosted migration version and exact SQL bytes
        run: node --test scripts/f17-hosted-migration-versions.test.mjs
      - run: npm run test:gradual
      - run: npm run test:governance
      - name: F17 map and maintenance regression
        run: node --experimental-strip-types --test scripts/f17-beta-extension-contract.test.mjs src/features/places/map/mapFailure.test.mjs src/features/places/map/mapboxLoader.test.mjs supabase/functions/_shared/maintenanceCheckoutGate.test.mjs
      - run: npm run test:release:guard
      - run: npm run test:f16:synthetic
      - run: npm run build
  gradual-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Ephemeral pinned browser, no production dependency
        run: |
          npm install --prefix /tmp/gradual-playwright --no-package-lock --ignore-scripts playwright@1.56.1
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            printf 'PAZO_CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            node /tmp/gradual-playwright/node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: Mobile/desktop ES/EN and account/admin server recovery, all external requests intercepted
        env:
          VITE_SUPABASE_URL: https://mrybvqdebbgcayuvgkkr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SYNTHETIC_ONLY_BROWSER_FIXTURE
          # Exercise real release default: Vercel may omit the optional presentation flag.
          VITE_PAZO_F16_SANDBOX_QA_UI: 'false'
          PAZO_PLAYWRIGHT_MODULE: /tmp/gradual-playwright/node_modules/playwright
        run: |
          npm run dev -- --host 127.0.0.1 --port 5183 --strictPort >/tmp/gradual-vite.log 2>&1 &
          gradual_vite_pid=$!
          trap 'kill "$gradual_vite_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5183/ >/dev/null
          node scripts/f16-gradual-live-browser.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gradual-ui-synthetic
          path: /tmp/pazo-gradual-ui
