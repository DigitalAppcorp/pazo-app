name: F16 Inert v7 Hosted HTTP One-Time
on:
  pull_request:
    branches:
      - release/mvp-beta-fast-track-20261010
permissions:
  contents: read
jobs:
  verify-inert-f16-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify hosted F16 responds 503 without sending secrets or financial events
        shell: bash
        run: |
          set -euo pipefail
          url='https://mrybvqdebbgcayuvgkkr.supabase.co/functions/v1/f16-paypal-webhook'
          for method in GET POST; do
            path="$RUNNER_TEMP/f16-v7-${method}.json"
            status=$(curl --silent --show-error --max-time 18 --retry 0 \
              --request "$method" --output "$path" --write-out '%{http_code}' "$url")
            if [ "$status" != '503' ]; then
              echo "FAIL: $method expected HTTP 503; received HTTP $status"
              exit 1
            fi
            node -e "const fs=require('node:fs');const data=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(data.code!=='f16_receiver_not_released')process.exit(1)" "$path"
            echo "PASS $method: HTTP 503 / f16_receiver_not_released"
          done
          echo 'PASS F16 v7 inert HTTP smoke: no credentials, signatures, events or buyer data transmitted'
