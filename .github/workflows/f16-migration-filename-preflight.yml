name: F16 Migration Filename Preflight

on:
  pull_request:
    branches:
      - release/mvp-beta-fast-track-20261010

permissions:
  contents: read

jobs:
  cli-migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate F16 migration name with official pinned Supabase CLI, no database connection
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN DATABASE_URL SUPABASE_DB_URL SUPABASE_DB_PASSWORD
          npx --yes supabase@2.120.0 migration new --help >/dev/null
          npx --yes supabase@2.120.0 migration new f16_private_verified_event_inbox
          file=$(find supabase/migrations -maxdepth 1 -type f -name '*_f16_private_verified_event_inbox.sql' | sort | tail -n 1)
          if [[ -z "$file" || ! -f "$file" ]]; then
            echo "BLOCKED: Supabase CLI failed to create a migration file" >&2
            exit 1
          fi
          test ! -s "$file"
          echo "CLI_GENERATED_F16_FILENAME=$(basename "$file")"
          echo "PASS: official CLI created an empty file; no hosted database was contacted"
