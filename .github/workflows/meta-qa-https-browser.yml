name: PAZO QA HTTPS one-shot synthetic Pixel verification
on:
  push:
    branches: [feat/issue169-meta-pixel-capi-off]
    paths:
      - '.github/workflows/meta-qa-https-browser.yml'
      - 'scripts/meta-qa-https-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned browser tools without provider credentials
        run: |
          npm ci
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Verify PAZO production boundaries and test-only syntax
        run: |
          node scripts/meta-production-boundary.mjs
          node --check scripts/meta-qa-https-browser.mjs
      - name: Run real Chromium on isolated HTTPS QA (one synthetic Pixel attempt)
        run: node scripts/meta-qa-https-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pazo-qa-https-pixel-observations
          path: artifacts/meta-qa-https/
          retention-days: 7
