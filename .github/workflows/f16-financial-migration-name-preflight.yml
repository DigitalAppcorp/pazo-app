name: F16 Private Finance Migration Name

on:
  pull_request:
    branches:
      - release/mvp-beta-fast-track-20261010

permissions:
  contents: read

jobs:
  generate-f16-financial-migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Use official pinned Supabase CLI without hosted credentials
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN DATABASE_URL SUPABASE_DB_URL SUPABASE_DB_PASSWORD
          npx --yes supabase@2.120.0 migration new f16_private_intents_financial_ledger
          file=$(find supabase/migrations -maxdepth 1 -name '*_f16_private_intents_financial_ledger.sql' | sort | tail -n 1)
          test -n "$file" && test -f "$file" && test ! -s "$file"
          echo "CLI_GENERATED_FINANCIAL_MIGRATION=$(basename "$file")"
          echo 'PASS: CLI generated a local empty migration; no hosted mutations'
