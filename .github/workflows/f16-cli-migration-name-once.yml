name: F16 CLI Migration Name One-Time (offline)
on:
  pull_request:
    branches:
      - release/mvp-beta-fast-track-20261010
permissions:
  contents: read
jobs:
  generate-f16-migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate official timestamp with Supabase CLI ONLY, no DB login
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${DATABASE_URL:-}"
          npx --yes supabase@2.120.0 migration new --help > /dev/null
          npx --yes supabase@2.120.0 migration new f16_global_webhook_admission
          name=$(find supabase/migrations -maxdepth 1 -name '*_f16_global_webhook_admission.sql' -printf '%f\n' | sort | tail -n 1)
          [[ "$name" =~ ^[0-9]{14}_f16_global_webhook_admission\.sql$ ]]
          echo "F16_CLI_GENERATED_FILENAME=$name"
          echo 'PASS: generated only inside temporary GitHub runner; no database mutation'
