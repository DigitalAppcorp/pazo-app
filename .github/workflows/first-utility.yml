name: First useful action isolated gates
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  utility-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: synthetic-utility-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: synthetic-utility-only
      PAZO_MARKETING_PG_MODE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:first-utility
      - run: npm run test:first-use
      - run: npm run test:first-utility:pg17
  utility-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: synthetic-utility-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: synthetic-utility-only
      PAZO_MARKETING_PG_MODE: ci
      PAZO_PLAYWRIGHT_MODULE: playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Use runner Chrome
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PAZO_CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - run: npm run test:first-utility:browser
      - name: Contextual first-use and keyboard flow (separate disposable database)
        env:
          PGDATABASE: issue142_contextual
        run: |
          createdb --maintenance-db=postgres issue142_contextual
          PAZO_CONTEXTUAL_TEST=true PAZO_UTILITY_OUTPUT=artifacts/issue142-contextual npm run test:first-use:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: first-utility-es-en-${{ github.run_id }}
          path: |
            artifacts/issue142-utility/
            artifacts/issue142-contextual/
          retention-days: 14
  visual-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAZO_PLAYWRIGHT_MODULE: playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Use runner Chrome
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PAZO_CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - run: PAZO_VISUAL_VERSION=candidate npm run test:issue147:visual
      - run: node scripts/issue147-gallery.mjs artifacts/issue147/candidate
      - name: Short mobile screen, ES and EN
        run: PAZO_VISUAL_VERSION=candidate PAZO_VISUAL_HEIGHT=568 PAZO_VISUAL_SMOKE=true PAZO_VISUAL_OUTPUT=artifacts/issue147/short npm run test:issue147:visual
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue147-composition-${{ github.run_id }}
          path: artifacts/issue147/
          retention-days: 14
