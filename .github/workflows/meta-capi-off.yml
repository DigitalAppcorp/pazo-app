name: Meta Pixel CAPI fail-closed candidate
on:
  pull_request:
    branches: [main, feat/issue168-ads2-attribution]
  push:
    branches: [feat/issue169-meta-pixel-capi-off]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meta-off:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/meta-conversion-off.test.mjs scripts/meta-delivery-coordinator.test.mjs scripts/meta-pixel-loader.test.mjs scripts/meta-receipt-off.test.mjs scripts/meta-receipt-adapter-off.test.mjs scripts/meta-outbox-repository-off.test.mjs scripts/meta-server-config-off.test.mjs scripts/meta-server-gateway-off.test.mjs scripts/meta-withdraw-off.test.mjs scripts/meta-withdraw-adapter-off.test.mjs scripts/meta-grant-off.test.mjs
      - run: node --check supabase/functions/_shared/metaConversion.mjs
      - run: node --check supabase/functions/_shared/metaCapi.mjs
      - run: node --check supabase/functions/_shared/metaPurposePolicy.mjs
      - run: node --check supabase/functions/_shared/metaDeliveryCoordinator.mjs
      - run: node --check supabase/functions/_shared/metaServerConfig.mjs
      - run: node --check supabase/functions/_shared/metaServerGateway.mjs
      - run: node --check supabase/functions/_shared/metaOutboxRepository.mjs
      - run: node --check src/features/marketing/metaPixel.mjs
      - run: node --check src/features/marketing/metaPixelLoader.mjs
      - run: node --check supabase/functions/pazo-meta-receipt/receiptCore.mjs
      - run: node --check supabase/functions/pazo-meta-receipt/receiptAdapter.mjs
      - run: node --check supabase/functions/pazo-meta-consent/withdrawCore.mjs
      - run: node --check supabase/functions/pazo-meta-consent/withdrawAdapter.mjs
      - run: node --check supabase/functions/pazo-meta-consent/grantCore.mjs
      - run: node --check supabase/functions/pazo-meta-consent/grantAdapter.mjs
      - run: grep -qx 'const META_WITHDRAW_ENDPOINT_RELEASED=false' supabase/functions/pazo-meta-consent/index.ts
      - run: grep -qx 'const META_RECEIPT_ENDPOINT_RELEASED=false' supabase/functions/pazo-meta-receipt/index.ts
      - run: grep -qx 'const META_RECEIPT_PRIVACY_REVIEWED=false' supabase/functions/pazo-meta-receipt/index.ts
      - run: grep -qx 'const META_GRANT_ENDPOINT_RELEASED=false' supabase/functions/pazo-meta-grant/index.ts
      - run: grep -qx 'const META_CONSENT_PRIVACY_REVIEWED=false' supabase/functions/pazo-meta-grant/index.ts
      - run: grep -qx 'export const META_CHOICES_RELEASED=false' src/features/marketing/MetaConsentChoice.tsx
      # All provider integrations remain deliberately unreferenced.
      - run: |
          if grep -E 'metaCapi|metaPixel' src/App.tsx src/features/marketing/marketingRuntime.ts supabase/functions/pazo-marketing-attribution/index.ts; then
            echo "Unexpected Meta import into production" >&2
            exit 1
          fi
