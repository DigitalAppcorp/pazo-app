name: Meta Pixel CAPI fail-closed candidate
on:
  pull_request:
    branches: [main, feat/issue168-ads2-attribution]
  push:
    branches: [feat/issue169-meta-pixel-capi-off]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meta-off:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/meta-conversion-off.test.mjs
      - run: node --check supabase/functions/_shared/metaConversion.mjs
      - run: node --check supabase/functions/_shared/metaCapi.mjs
      - run: node --check src/features/marketing/metaPixel.mjs
      # All provider integrations remain deliberately unreferenced.
      - run: |
          if grep -E 'metaCapi|metaPixel' src/App.tsx src/features/marketing/marketingRuntime.ts supabase/functions/pazo-marketing-attribution/index.ts; then
            echo "Unexpected Meta import into production" >&2
            exit 1
          fi
