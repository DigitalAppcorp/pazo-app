name: CI

on:
  pull_request:
    branches:
      - main
      - release/mvp-beta-fast-track-20261010
  push:
    branches:
      - main
      - release/mvp-beta-fast-track-20261010
      - fix/f14-nosuchkey-verification-20261012
      - fix/f14-verified-reconciliation-20261012

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hardening + architecture + privacy + ops governance checks
        run: npm run test:governance

      - name: F16 synthetic reconciliation and Sandbox preflight syntax (offline)
        run: |
          node --check scripts/f16-paypal-verify-plan-readonly.mjs
          node --check scripts/f16-paypal-verify-webhooks-readonly.mjs
          node --check scripts/f16-paypal-verify-webhook-destination-readonly.mjs
          npm run test:f16:synthetic

      - name: Build
        env:
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: F14 media purge regressions
        run: npm run test:f14

      - name: Operator PowerShell syntax without credentials or provider calls
        shell: pwsh
        run: |
          foreach ($file in @('scripts/backup-database.ps1','scripts/pack-backup-age.ps1','scripts/f16-paypal-sandbox-plan.ps1')) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file),[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell syntax error in $file" }
          }

      - name: Lint (legacy debt is currently non-blocking)
        continue-on-error: true
        run: npm run lint

  f14-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: f14_admin
          POSTGRES_DB: f14_synthetic
          # Disposable local service password; never a hosted credential.
          POSTGRES_PASSWORD: f14_synthetic_ci_only
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US --locale=en_US.UTF-8
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U f14_admin -d f14_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: f14_synthetic_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore audited catalog structure without hosted connections
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/catalog-baseline.sql
          node scripts/f14-postgres-catalog.mjs
      - name: Apply both pending migrations in order and repeat idempotently
        run: |
          for attempt in 1 2; do
            psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
              -c 'SET ROLE postgres;' \
              -f supabase/migrations/20261010222006_f14_media_purge_retry_reconciliation.sql \
              -f supabase/migrations/20261011022000_f14_media_url_alias_guard.sql \
              -f supabase/migrations/20261012063205_f14_one_object_admin_reconcile.sql
          done
          node scripts/f14-postgres-catalog.mjs
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/metadata.sql -f supabase/tests/f14/synthetic-cases.sql
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/one-object-reconcile-cases.sql
      - name: Pre-existing aliases and real two-session concurrency
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c "SET pazo.test.prepare_claims='false';" \
            -f supabase/tests/f14/concurrency-fixture.sql \
            -f supabase/tests/f14/alias-before-claim.sql \
            -f supabase/tests/f14/cleanup.sql
          node scripts/f14-postgres-concurrency.mjs
      - name: Backup verification SQL on synthetic tables and sequences only
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -Atq -v ON_ERROR_STOP=1 \
            -o "$RUNNER_TEMP/backup-catalog.json" -f scripts/backup-catalog-verification.sql
          node --input-type=module -e 'import fs from "node:fs"; JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/backup-catalog.json", "utf8")); console.log("Backup catalog query PASS on synthetic PostgreSQL; no hosted backup certification.");'
      - name: Reconciliation-only two-session lock and idempotency
        run: node scripts/f14-one-object-reconciliation-concurrency.mjs

      # F16 consent foundation. Verify ONLY in this disposable
      # PostgreSQL service to verify RLS/roles and synthetic-owner behaviour.
      - name: F16 consent foundation security SQL in disposable PostgreSQL only
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/migrations/20261013215221_f16_supporter_wall_consents_foundation.sql
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -f supabase/tests/supporter/consent-metadata.sql \
            -f supabase/tests/supporter/consent-synthetic.sql

      # F16-P05: SQL draft lives under supabase/drafts NOT migrations.
      # An explicit database/session guard prevents execution outside
      # the disposable f14_synthetic PostgreSQL CI service.
      - name: F16 P05 draft schema security and synthetic integrity ONLY
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/tests/supporter/p05-disposable-parent-fixture.sql \
            -f supabase/drafts/f16_p05_private_prospective_evidence_v1_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-draft-security-metadata.sql \
            -f supabase/tests/supporter/p05-draft-synthetic-cases.sql

      - name: F16 P05 event inbox claim draft with disabled rollout (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p05_inbox_claim_v1_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-inbox-claim-security.sql \
            -f supabase/tests/supporter/p05-inbox-claim-synthetic.sql \
            -f supabase/tests/supporter/p05-inbox-finish-synthetic.sql

      - name: F16 P05 real two-session claim concurrency (disposable only)
        run: node scripts/f16-p05-inbox-claim-concurrency.mjs

      - name: F16 P05 inverse claimed subscription ID (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p05_claimed_subscription_inverse_lookup_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-claimed-subscription-inverse-security.sql \
            -f supabase/tests/supporter/p05-claimed-subscription-inverse-synthetic.sql

      - name: F16 P05 signed dispute event RPC draft and permissions (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p05_dispute_event_rpc_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-dispute-event-rpc-synthetic.sql

      - name: F16 P05 dispute ownership service-only ledger reader (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p05_dispute_private_ledger_read_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-dispute-private-ledger-security.sql \
            -f supabase/tests/supporter/p05-dispute-private-ledger-synthetic.sql

      - name: F16 P06 durable checkout consent and per-owner idempotency (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p06_durable_checkout_consent_DO_NOT_APPLY.sql \
            -f supabase/drafts/f16_p08_read_checkout_recovery_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p06-durable-checkout-consent-synthetic.sql \
            -f supabase/drafts/f16_p10_recovered_checkout_binding_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p10-recovered-checkout-binding-synthetic.sql
  f16-p12-staged-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: f14_admin
          POSTGRES_DB: f14_synthetic
          POSTGRES_PASSWORD: f14_synthetic_ci_only
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US --locale=en_US.UTF-8
        ports: ["55442:5432"]
        options: >-
          --health-cmd "pg_isready -U f14_admin -d f14_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: f14_synthetic_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify P12 reviewed SQL composition without database writes
        run: node scripts/f16-p12-build-staged-install.mjs --verify
      - name: Bootstrap isolated private-schema prerequisites
        run: |
          psql -X -h 127.0.0.1 -p 55442 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/catalog-baseline.sql
          psql -X -h 127.0.0.1 -p 55442 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/migrations/20261013215221_f16_supporter_wall_consents_foundation.sql
          psql -X -h 127.0.0.1 -p 55442 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/tests/supporter/p05-disposable-parent-fixture.sql
      - name: Apply staged candidate in disposable PostgreSQL ONLY
        run: |
          psql -X -h 127.0.0.1 -p 55442 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c "SET ROLE postgres; SET pazo.f16_p12_go='DISPOSABLE_P12_LAB_ONLY';" -f supabase/drafts/f16_p12_staged_install_REQUIRES_PO_GO.sql
      - name: Validate bilingual offers, one-shot claim and recovery binding
        run: |
          psql -X -h 127.0.0.1 -p 55442 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/supporter/p06-durable-checkout-consent-synthetic.sql -f supabase/tests/supporter/p10-recovered-checkout-binding-synthetic.sql

