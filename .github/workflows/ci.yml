name: CI

on:
  pull_request:
    branches:
      - f13/section-titles-20261012
      - main
      - release/mvp-beta-fast-track-20261010
  push:
    branches:
      - f13/section-titles-20261012
      - main
      - release/mvp-beta-fast-track-20261010
      - fix/f14-nosuchkey-verification-20261012
      - fix/f14-verified-reconciliation-20261012

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify reconciled historical migration Git blobs
        run: node --test scripts/f17-historical-migration-alignment.test.mjs

      - name: Hardening + architecture + privacy + ops governance checks
        run: npm run test:governance

      - name: F17 mobile, support, gift and maintenance security contracts (draft only)
        run: node --experimental-strip-types --test scripts/f17-beta-extension-contract.test.mjs src/features/places/map/mapFailure.test.mjs src/features/places/map/mapboxLoader.test.mjs supabase/functions/_shared/maintenanceCheckoutGate.test.mjs

      - name: F16 Vault PostgreSQL 2201B credential regex regression
        run: node --test scripts/f16-live-vault-regex-domain.test.mjs

      - name: F16 synthetic reconciliation and Sandbox preflight syntax (offline)
        run: |
          node --check scripts/f16-paypal-verify-plan-readonly.mjs
          node --check scripts/f16-paypal-verify-webhooks-readonly.mjs
          node --check scripts/f16-paypal-verify-webhook-destination-readonly.mjs
          node --check scripts/f16-p43-vercel-db-env-names-readonly.mjs
          node --check scripts/f16-p43-ephemeral-readonly-preflight.mjs
          node --check scripts/f16-p43b-ephemeral-readonly-preflight.mjs
          node --test src/features/supporter/testing/f16P43EphemeralReadOnlyPreflight.test.mjs
          node --test src/features/supporter/testing/f16P43VercelDbEnvNamesReadOnly.test.mjs
          npm run test:f16:synthetic

      - name: F16 MVP beta-to-Live release static guard
        run: npm run test:release:guard

      - name: Build
        env:
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Verify compiled PWA assets and PayPal return routes
        run: npm run test:prepreview:dist

      - name: F14 media purge regressions
        run: npm run test:f14

      - name: Operator PowerShell syntax without credentials or provider calls
        shell: pwsh
        run: |
          foreach ($file in @('scripts/backup-database.ps1','scripts/pack-backup-age.ps1','scripts/f16-paypal-sandbox-plan.ps1','scripts/f16-p43-db-access-readonly.ps1','scripts/f16-p43-local-tooling-inventory.ps1','scripts/f16-p43-next-prereqs-readonly.ps1','scripts/f16-p42-session-pooler-tls-readonly-once.ps1')) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file),[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell syntax error in $file" }
          }

      - name: P42 one-shot TLS probe preflight rejects unsafe hosts without connecting
        shell: pwsh
        run: |
          $result = @(& ./scripts/f16-p42-session-pooler-tls-readonly-once.ps1 -DbHost 'invalid.example.com' -CaCertificatePath '/missing-test-ca.pem')
          if ($result[0] -ne 'P42_TLS_READ_ONLY_ONCE_BLOCKED_PRECHECK_INPUT' -or
              $result[1] -ne 'P42_NO_PROVISIONING_NO_PAYMENTS') {
            throw 'P42 one-shot local-only input guard failed'
          }
          $script = Get-Content -LiteralPath 'scripts/f16-p42-session-pooler-tls-readonly-once.ps1' -Raw
          if (-not $script.Contains("PGSSLMODE'] = 'verify-full'") -or
              -not $script.Contains('BEGIN TRANSACTION READ ONLY;') -or
              -not $script.Contains("default_transaction_read_only=on") -or
              $script.Contains('pg_catalog.pg_stat_ssl') -or
              -not $script.Contains("PGGSSENCMODE'] = 'disable'") -or
              -not $script.Contains("PGSSLMINPROTOCOLVERSION'] = 'TLSv1.2'") -or
              -not $script.Contains("PGSSLMAXPROTOCOLVERSION'] = 'TLSv1.3'") -or
              -not $script.Contains('WaitForExit(25000)')) {
            throw 'P42 one-shot local-only required fail-closed controls missing'
          }
          Write-Output 'P42_TLS_PROBE_OFFLINE_STATIC_AND_INPUT_GUARD_PASS_ONLY'
          & ./src/features/supporter/testing/f16P42SessionPoolerTlsReadOnly.offline.ps1

      - name: Enforce P42 data-only exclusion in real PowerShell backup command (static)
        shell: pwsh
        run: |
          $script = Get-Content -LiteralPath scripts/backup-database.ps1 -Raw
          $calls = [regex]::Matches($script, "(?s)Invoke-PazoPg\s+'pg_dump'\s+@\((?<args>.*?)\)\s+'database-private\.log'")
          if ($calls.Count -ne 1) { throw 'P42: unexpected number of pg_dump commands' }
          $args = $calls[0].Groups['args'].Value
          if (-not $args.Contains("'--exclude-table-data=supporter_private.p42_activation_signing_keys'")) {
            throw 'P42: pg_dump must exclude only key table data'
          }
          if ($args -match '--exclude-table=' -or $args -match '--schema-only' -or $args -match '--data-only') {
            throw 'P42: full schema and other data must remain in logical backup'
          }
          Write-Output 'P42 real backup pg_dump argument guard PASS (static; no database accessed)'

      - name: P42 CA offline structural validator - synthetic X509 only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rsa = [Security.Cryptography.RSA]::Create(2048)
          $request = [Security.Cryptography.X509Certificates.CertificateRequest]::new(
            'CN=PAZO ephemeral CI test CA',
            $rsa,
            [Security.Cryptography.HashAlgorithmName]::SHA256,
            [Security.Cryptography.RSASignaturePadding]::Pkcs1
          )
          $request.CertificateExtensions.Add(
            [Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($true,$false,0,$true)
          )
          $request.CertificateExtensions.Add(
            [Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
              [Security.Cryptography.X509Certificates.X509KeyUsageFlags]::KeyCertSign,$true
            )
          )
          $cert = $request.CreateSelfSigned([DateTimeOffset]::UtcNow.AddHours(-1),[DateTimeOffset]::UtcNow.AddHours(24))
          try {
            $caPath = Join-Path $env:RUNNER_TEMP 'p42-synthetic-ca.pem'
            [IO.File]::WriteAllText($caPath, $cert.ExportCertificatePem())
            $status = @(& ./scripts/f16-p42-verify-local-ca-offline.ps1 -CaCertificatePath $caPath)
            if ($status[0] -ne 'P42_LOCAL_CA_FILE_STRUCTURAL_PASS_OFFLINE' -or
                $status[1] -ne 'P42_CA_PROVENANCE_AND_SERVER_TLS_VERIFY_FULL_NOT_CHECKED' -or
                $status[2] -ne 'P42_HOSTED_DB_WRITE_UNVERIFIED_NO_PROVISIONING') {
              throw 'P42 offline CA validator status mismatch'
            }
            $invalidPath = Join-Path $env:RUNNER_TEMP 'p42-synthetic-invalid.pem'
            [IO.File]::WriteAllText($invalidPath,'not a certificate')
            $rejected = $false
            try {
              & ./scripts/f16-p42-verify-local-ca-offline.ps1 -CaCertificatePath $invalidPath | Out-Null
            } catch {
              $rejected = $_.Exception.Message -match 'P42_LOCAL_CA_FILE_CHECK_BLOCKED'
            }
            if (-not $rejected) { throw 'P42 validator did not reject invalid file' }
            Write-Output 'P42_CA_STRUCTURAL_CHECK_CI_SYNTHETIC_PASS_NO_NETWORK'
          } finally {
            $cert.Dispose()
            $rsa.Dispose()
          }

      - name: Lint (legacy debt is currently non-blocking)
        continue-on-error: true
        run: npm run lint

  f14-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: f14_admin
          POSTGRES_DB: f14_synthetic
          # Disposable local service password; never a hosted credential.
          POSTGRES_PASSWORD: f14_synthetic_ci_only
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US --locale=en_US.UTF-8
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U f14_admin -d f14_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: f14_synthetic_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore audited catalog structure without hosted connections
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/catalog-baseline.sql
          node scripts/f14-postgres-catalog.mjs
      - name: Apply both pending migrations in order and repeat idempotently
        run: |
          for attempt in 1 2; do
            psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
              -c 'SET ROLE postgres;' \
              -f supabase/migrations/20261010222006_f14_media_purge_retry_reconciliation.sql \
              -f supabase/migrations/20261011022000_f14_media_url_alias_guard.sql \
              -f supabase/migrations/20261012071140_f14_one_object_admin_reconcile.sql
          done
          node scripts/f14-postgres-catalog.mjs
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/metadata.sql -f supabase/tests/f14/synthetic-cases.sql
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/one-object-reconcile-cases.sql
      - name: Pre-existing aliases and real two-session concurrency
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c "SET pazo.test.prepare_claims='false';" \
            -f supabase/tests/f14/concurrency-fixture.sql \
            -f supabase/tests/f14/alias-before-claim.sql \
            -f supabase/tests/f14/cleanup.sql
          node scripts/f14-postgres-concurrency.mjs
      - name: Backup verification SQL on synthetic tables and sequences only
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -Atq -v ON_ERROR_STOP=1 \
            -o "$RUNNER_TEMP/backup-catalog.json" -f scripts/backup-catalog-verification.sql
          node --input-type=module -e 'import fs from "node:fs"; JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/backup-catalog.json", "utf8")); console.log("Backup catalog query PASS on synthetic PostgreSQL; no hosted backup certification.");'
      - name: Reconciliation-only two-session lock and idempotency
        run: node scripts/f14-one-object-reconciliation-concurrency.mjs

      # F16 consent foundation. Verify ONLY in this disposable
      # PostgreSQL service to verify RLS/roles and synthetic-owner behaviour.
      - name: F16 consent foundation security SQL in disposable PostgreSQL only
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/migrations/20261013215221_f16_supporter_wall_consents_foundation.sql
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -f supabase/tests/supporter/consent-metadata.sql \
            -f supabase/tests/supporter/consent-synthetic.sql

      # F16-P05: SQL draft lives under supabase/drafts NOT migrations.
      # An explicit database/session guard prevents execution outside
      # the disposable f14_synthetic PostgreSQL CI service.
      - name: F16 P05 draft schema security and synthetic integrity ONLY
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/tests/supporter/p05-disposable-parent-fixture.sql \
            -f supabase/drafts/f16_p05_private_prospective_evidence_v1_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-draft-security-metadata.sql \
            -f supabase/tests/supporter/p05-draft-synthetic-cases.sql

      - name: F16 P05 event inbox claim draft with disabled rollout (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p05_inbox_claim_v1_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-inbox-claim-security.sql \
            -f supabase/tests/supporter/p05-inbox-claim-synthetic.sql \
            -f supabase/tests/supporter/p05-inbox-finish-synthetic.sql

      - name: F16 P05 real two-session claim concurrency (disposable only)
        run: node scripts/f16-p05-inbox-claim-concurrency.mjs

      - name: F16 P05 inverse claimed subscription ID (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p05_claimed_subscription_inverse_lookup_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-claimed-subscription-inverse-security.sql \
            -f supabase/tests/supporter/p05-claimed-subscription-inverse-synthetic.sql

      - name: F16 P05 signed dispute event RPC draft and permissions (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p05_dispute_event_rpc_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-dispute-event-rpc-synthetic.sql

      - name: F16 P05 dispute ownership service-only ledger reader (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p05_dispute_private_ledger_read_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p05-dispute-private-ledger-security.sql \
            -f supabase/tests/supporter/p05-dispute-private-ledger-synthetic.sql

      - name: F16 P06 durable checkout consent and per-owner idempotency (disposable only)
        run: |
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p06_durable_checkout_consent_DO_NOT_APPLY.sql \
            -f supabase/drafts/f16_p08_read_checkout_recovery_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p06-durable-checkout-consent-synthetic.sql \
            -f supabase/drafts/f16_p10_recovered_checkout_binding_DO_NOT_APPLY.sql \
            -f supabase/tests/supporter/p10-recovered-checkout-binding-synthetic.sql
      - name: F16 P06 approved QA bilingual offer publish staging (disposable PG17 ONLY)
        run: |
          node --test src/features/supporter/testing/f16P06StagedOfferSqlReview.test.mjs
          # Guard must reject missing explicit publication flag; no partial rows.
          if psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c 'SET ROLE postgres;' \
            -f supabase/drafts/f16_p06_sandbox_qa_approved_offer_REQUIRES_NEW_PUBLISH_GO.sql >/dev/null 2>&1; then
            echo 'P06 staging incorrectly accepted unapproved publish'; exit 1
          fi
          psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c "SET ROLE postgres; SET pazo.f16_p06_qa_publish_go='PO_EXPLICIT_QA_OFFER_PUBLISH_AFTER_OWNER_GATE';" \
            -f supabase/drafts/f16_p06_sandbox_qa_approved_offer_REQUIRES_NEW_PUBLISH_GO.sql
          # Replaying an already published immutable pair must be rejected.
          if psql -X -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 \
            -c "SET ROLE postgres; SET pazo.f16_p06_qa_publish_go='PO_EXPLICIT_QA_OFFER_PUBLISH_AFTER_OWNER_GATE';" \
            -f supabase/drafts/f16_p06_sandbox_qa_approved_offer_REQUIRES_NEW_PUBLISH_GO.sql >/dev/null 2>&1; then
            echo 'P06 staging incorrectly allowed second publish'; exit 1
          fi
          result=$(psql -X -Atq -h 127.0.0.1 -p 55441 -U f14_admin -d f14_synthetic \
            -v ON_ERROR_STOP=1 -c "SET ROLE postgres; SELECT count(*)::text || '|' || count(DISTINCT locale)::text || '|' || count(DISTINCT sha256)::text FROM supporter_private.paypal_p06_offers WHERE version='pazo-supporter-sandbox.qa20261016-v1';")
          test "$result" = "2|2|2"
          echo 'P06 sandbox QA bilingual offer exact copy, guard, and idempotency PASS (DISPOSABLE only)'

  f16-p12-staged-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: f14_admin
          POSTGRES_DB: f14_synthetic
          POSTGRES_PASSWORD: f14_synthetic_ci_only
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US --locale=en_US.UTF-8
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U f14_admin -d f14_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: f14_synthetic_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify P12 reviewed SQL composition without database writes
        run: node scripts/f16-p12-build-staged-install.mjs --verify
      - name: Bootstrap isolated private-schema prerequisites
        run: |
          psql -X -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/catalog-baseline.sql
          psql -X -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/migrations/20261013215221_f16_supporter_wall_consents_foundation.sql
          psql -X -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/tests/supporter/p05-disposable-parent-fixture.sql
          psql -X -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/tests/supporter/p12-disposable-existing-reversal-fixture.sql
      - name: Apply staged candidate in disposable PostgreSQL ONLY
        run: |
          psql -X -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c "SET ROLE postgres; SET pazo.f16_p12_go='DISPOSABLE_P12_LAB_ONLY';" -f supabase/drafts/f16_p12_staged_install_REQUIRES_PO_GO.sql
      - name: Validate bilingual offers, one-shot claim and recovery binding
        run: |
          psql -X -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/supporter/p06-durable-checkout-consent-synthetic.sql -f supabase/tests/supporter/p10-recovered-checkout-binding-synthetic.sql
      - name: Test P14 exact accepted offer acknowledgement on disposable PostgreSQL
        run: |
          psql -X -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/drafts/f16_p14_checkout_acknowledgement_DO_NOT_APPLY.sql -f supabase/tests/supporter/p14-checkout-acknowledgement-synthetic.sql

  f16-p21-worker-schema-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: f14_admin
          POSTGRES_DB: f14_synthetic
          POSTGRES_PASSWORD: f14_synthetic_ci_only
        ports:
          - 55443:5432
        options: >-
          --health-cmd "pg_isready -U f14_admin -d f14_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: f14_synthetic_ci_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify reviewed P05 claim code is unchanged
        run: node scripts/f16-p21-verify-staged-worker.mjs
      - name: Bootstrap disposable private inbox in hosted-equivalent shape
        run: |
          psql -X -h 127.0.0.1 -p 55443 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -f supabase/tests/f14/catalog-baseline.sql
          psql -X -h 127.0.0.1 -p 55443 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/migrations/20261013215221_f16_supporter_wall_consents_foundation.sql
          psql -X -h 127.0.0.1 -p 55443 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/tests/supporter/p05-disposable-parent-fixture.sql -f supabase/tests/supporter/p21-existing-hosted-inbox-fixture.sql
      - name: Install only staged P21 functions with worker OFF
        run: |
          psql -X -h 127.0.0.1 -p 55443 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/drafts/f16_p21_hosted_compatible_inbox_worker_DO_NOT_APPLY.sql
      - name: Check service-only permissions, historical cutoff and fencing
        run: |
          psql -X -h 127.0.0.1 -p 55443 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/tests/supporter/p05-inbox-claim-security.sql -f supabase/tests/supporter/p05-inbox-claim-synthetic.sql -f supabase/tests/supporter/p05-inbox-finish-synthetic.sql -f supabase/tests/supporter/p21-no-historical-processing-synthetic.sql
      - name: Stage P24 original consent proof only in disposable PostgreSQL
        run: |
          psql -X -h 127.0.0.1 -p 55443 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/tests/supporter/p24-p06-contract-fixture.sql -f supabase/drafts/f16_p24_claim_scoped_consent_lineage_DO_NOT_APPLY.sql -f supabase/tests/supporter/p24-consent-lineage-synthetic.sql
      - name: P25 stage unique first-obligation REVIEW reservation in isolated PostgreSQL
        run: |
          psql -X -h 127.0.0.1 -p 55443 -U f14_admin -d f14_synthetic -v ON_ERROR_STOP=1 -c 'SET ROLE postgres;' -f supabase/drafts/f16_p25_first_obligation_review_reservation_DO_NOT_APPLY.sql -f supabase/tests/supporter/p25-first-obligation-review-reservation-synthetic.sql
      - name: P26 blocked ledger transactional integrity in isolated PostgreSQL
        run: |
