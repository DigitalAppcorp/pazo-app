  f16-public-benefits-live-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: f16_lab
          POSTGRES_DB: f16_lab
          POSTGRES_PASSWORD: f16_synthetic_disposable_only
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U f16_lab -d f16_lab"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: f16_synthetic_disposable_only
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Apply the exact draft and assert LIVE-only public benefits in a disposable PostgreSQL 17
        run: |
          port=${{ job.services.postgres.ports[5432] }}
          psql -X -h 127.0.0.1 -p "$port" -U f16_lab -d f16_lab -v ON_ERROR_STOP=1 \
            -f supabase/tests/supporter/live-only-public-benefits-lab-setup.sql \
            -f supabase/drafts/pazo_public_benefits_live_only_REQUIRES_PO_GO.sql \
            -f supabase/tests/supporter/live-only-public-benefits-lab-cases.sql

  public-beta-postflight-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout inspected PAZO code
        uses: actions/checkout@v7
      - name: Setup Node for outbound HTTPS smoke
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Canonical public beta PWA and PayPal callback HTTP negative probes
        run: node scripts/f16-public-pwa-http-gate.mjs

  canonical-chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout auditable tests
        uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned ephemeral Chromium automation package
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Use runner Chrome or install matching Chromium
        run: |
          # GitHub's Ubuntu image already includes Chrome and its libraries.
          # Avoid an unrelated apt mirror stall during read-only release QA.
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            "$browser_path" --version
            printf 'PAZO_CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - name: Check associated email and login form labels in proposed code
        run: node --test scripts/f16-auth-field-label-contract.test.mjs
      - name: Exercise deployed production Auth and PWA in real Chromium
        env:
          PAZO_E2E_AUTH_LABELS_DEPLOYED: 'true'
        run: node scripts/f16-beta-canonical-chromium-e2e.mjs
