name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hardening + architecture + privacy + ops governance checks
        run: npm run test:governance

      - name: Build
        env:
          VITE_APP_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Lint (legacy debt is currently non-blocking)
        continue-on-error: true
        run: npm run lint
