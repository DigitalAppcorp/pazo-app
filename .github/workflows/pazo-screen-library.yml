name: PAZO screen library — hosted non-admin captures
on:
  push:
    branches: [chore/pazo-screen-library-capture-20261030]
    paths:
      - 'scripts/screen-library-capture.mjs'
      - '.github/workflows/pazo-screen-library.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAZO_SCREEN_ORIGIN: https://pazo-app.vercel.app
      PAZO_SCREEN_DATE: '2026-10-30'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install browser
        run: |
          npx playwright install --with-deps chromium
      - name: Capture public and synthetic-account views (no admin, no real writes)
        run: node scripts/screen-library-capture.mjs
      - name: Commit generated images to this review branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screen-library/captures/2026-10-30/
          if ! git diff --cached --quiet; then
            git commit -m "docs: add hosted non-admin screen captures [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Preserve capture report even when incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pazo-screen-library-2026-10-30
          path: docs/screen-library/captures/2026-10-30/
          if-no-files-found: warn
          retention-days: 30
