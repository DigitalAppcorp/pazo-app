name: PAZO Marketing private attribution draft (isolated)
on:
  push:
    branches: ['feat/f17-marketing-*']
    paths:
      - 'supabase/migrations/*pazo_marketing*.sql'
      - 'supabase/tests/marketing/**'
      - 'supabase/operations/marketing-*.sql'
      - 'scripts/marketing-*.mjs'
      - 'src/features/marketing/**'
      - 'src/features/admin/components/AdminMarketingPanel.tsx'
      - 'src/features/admin/components/AdminDashboard.tsx'
      - 'src/features/admin/adminDashboardService.ts'
      - 'src/features/admin/testing/adminMarketingDashboard.test.mjs'
      - 'src/context/AuthContext.tsx'
      - 'src/App.tsx'
      - 'src/components/views/OnboardingView.tsx'
      - 'supabase/functions/pazo-marketing-attribution/**'
      - 'supabase/functions/pazo-marketing-landing/**'
      - 'supabase/config.toml'
      - 'package.json'
      - '.github/workflows/marketing-attribution-pg17.yml'
  pull_request:
    branches: [f17/beta-final-mobile-support-admin-20261022]
    paths:
      - 'supabase/migrations/*pazo_marketing*.sql'
      - 'supabase/tests/marketing/**'
      - 'supabase/operations/marketing-*.sql'
      - 'scripts/marketing-*.mjs'
      - 'src/features/marketing/**'
      - 'src/features/admin/components/AdminMarketingPanel.tsx'
      - 'src/features/admin/components/AdminDashboard.tsx'
      - 'src/features/admin/adminDashboardService.ts'
      - 'src/features/admin/testing/adminMarketingDashboard.test.mjs'
      - 'src/context/AuthContext.tsx'
      - 'src/App.tsx'
      - 'src/components/views/OnboardingView.tsx'
      - 'supabase/functions/pazo-marketing-attribution/**'
      - 'supabase/functions/pazo-marketing-landing/**'
      - 'supabase/config.toml'
      - 'package.json'
      - '.github/workflows/marketing-attribution-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-privacy-and-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: synthetic-marketing-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: synthetic-marketing-only
      PAZO_MARKETING_PG_MODE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Assert all four marketing release gates remain OFF
        run: |
          grep -Fq 'export const PAZO_MARKETING_COLLECTION_ENABLED = false' src/features/marketing/marketingRuntime.ts
          grep -Fq 'export const PAZO_MARKETING_LANDING_ENABLED = false' src/features/marketing/marketingRuntime.ts
          grep -Fq 'const MARKETING_INTAKE_RELEASED = false' supabase/functions/pazo-marketing-attribution/index.ts
          grep -Fq 'const MARKETING_LANDING_RELEASED=false' supabase/functions/pazo-marketing-landing/index.ts
          grep -Fq 'enabled boolean NOT NULL DEFAULT false' supabase/migrations/20261024020632_pazo_marketing_firstparty_attribution.sql
          grep -Fq 'retention_days smallint NOT NULL DEFAULT 0' supabase/migrations/20261024020632_pazo_marketing_firstparty_attribution.sql
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client >/dev/null
      - name: Actual migrations, privacy/roles, concurrent ingest and atomic retention with Cron provider double
        run: npm run test:marketing:pg17
      - name: CLI migration stub — synthetic workspace, no remote connection
        run: |
          tmpdir="$RUNNER_TEMP/pazo-marketing-cli"
          mkdir -p "$tmpdir/supabase/migrations"
          cd "$tmpdir"
          npx --yes supabase@2.121.0 migration new pazo_marketing_firstparty_attribution
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_pazo_marketing_firstparty_attribution.sql' -printf '%f\n')"
          test -n "$generated"
          test "$(printf '%s\n' "$generated" | wc -l)" -eq 1
          echo "PAZO_SUPABASE_CLI_GENERATED_FILENAME=$generated"
          echo 'No SQL staged in production or linked Supabase project'
      - name: Run local front-end attribution unit contract
        run: npm run test:marketing
      - run: npm ci --no-audit --no-fund
      - name: Ephemeral browser, no application dependency
        run: |
          npm install --prefix /tmp/marketing-playwright --no-package-lock --ignore-scripts playwright@1.56.1
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            printf 'PAZO_CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            node /tmp/marketing-playwright/node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: Actual Auth/onboarding/Edge/PG17/admin E2E, synthetic email/challenge, no hosted traffic
        env:
          VITE_SUPABASE_URL: https://mrybvqdebbgcayuvgkkr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SYNTHETIC_ONLY_BROWSER_FIXTURE
          VITE_PAZO_MARKETING_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          PAZO_PLAYWRIGHT_MODULE: /tmp/marketing-playwright/node_modules/playwright
        run: |
          npm run dev -- --host 127.0.0.1 --port 5185 --strictPort >/tmp/marketing-vite.log 2>&1 &
          marketing_vite_pid=$!
          trap 'kill "$marketing_vite_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5185/ >/dev/null
          npm run test:marketing:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: marketing-synthetic-browser
          path: /tmp/pazo-marketing-ui
