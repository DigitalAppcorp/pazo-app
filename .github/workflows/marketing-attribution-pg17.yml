name: PAZO Marketing private attribution draft (isolated)
on:
  push:
    branches: ['feat/f17-marketing-*']
    paths:
      - 'supabase/drafts/marketing/**'
      - 'supabase/tests/marketing/**'
      - 'src/features/marketing/**'
      - 'supabase/functions/pazo-marketing-attribution/**'
      - 'package.json'
      - '.github/workflows/marketing-attribution-pg17.yml'
  pull_request:
    branches: [f17/beta-final-mobile-support-admin-20261022]
    paths:
      - 'supabase/drafts/marketing/**'
      - 'supabase/tests/marketing/**'
      - 'src/features/marketing/**'
      - 'supabase/functions/pazo-marketing-attribution/**'
      - 'package.json'
      - '.github/workflows/marketing-attribution-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-privacy-and-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: synthetic-marketing-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: synthetic-marketing-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client >/dev/null
      - name: Prepare disposable roles and database fixture
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/marketing/fixtures-pg17.sql
      - name: Stage INERT SQL draft on disposable PostgreSQL 17
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/marketing/pazo_first_party_attribution_v1.sql
      - name: Check private ACL, QA exclusions, deduplication, cohorts and rollback
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/marketing/private-attribution-pg17.sql
      - name: Run local front-end attribution unit contract
        run: npm run test:marketing
