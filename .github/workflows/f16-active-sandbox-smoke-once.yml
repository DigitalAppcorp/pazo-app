name: F16 Sandbox v12 HTTP Smoke (One-Time)
on:
  pull_request:
    branches: [release/mvp-beta-fast-track-20261010]
permissions:
  contents: read
jobs:
  verify-sandbox-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: GET must return 405; unsigned malformed POST must return 400
        shell: bash
        run: |
          set -euo pipefail
          url='https://mrybvqdebbgcayuvgkkr.supabase.co/functions/v1/f16-paypal-webhook'
          get_body="$RUNNER_TEMP/f16-v12-get.json"
          get_status=$(curl --silent --show-error --retry 0 --max-time 15 \
            -X GET -o "$get_body" -w '%{http_code}' "$url")
          test "$get_status" = '405' || { echo "FAIL: GET HTTP $get_status (expected 405)"; exit 1; }
          node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.code!=="method_not_allowed")process.exit(1)' "$get_body"
          echo 'PASS F16 Sandbox GET 405 method_not_allowed'
          post_body="$RUNNER_TEMP/f16-v12-invalid-post.json"
          post_status=$(curl --silent --show-error --retry 0 --max-time 15 \
            -X POST -H 'Content-Type: application/json' --data '{}' \
            -o "$post_body" -w '%{http_code}' "$url")
          test "$post_status" = '400' || { echo "FAIL: unsigned POST HTTP $post_status (expected 400)"; exit 1; }
          node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(x.code!=="missing_or_invalid_headers")process.exit(1)' "$post_body"
          echo 'PASS F16 Sandbox unsigned POST 400 missing_or_invalid_headers'
          echo 'No genuine PayPal event, credentials, payments or SQL mutations performed'
