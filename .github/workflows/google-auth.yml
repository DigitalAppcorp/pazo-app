name: PAZO Google sign-in isolated gates
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/context/AuthContext.tsx'
      - 'src/App.tsx'
      - 'src/components/views/OnboardingView.tsx'
      - 'src/features/auth/**'
      - 'src/features/legal/**'
      - 'src/main.tsx'
      - 'vercel.json'
      - 'src/features/marketing/**'
      - 'scripts/google-auth-*.mjs'
      - '.github/workflows/google-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  google-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAZO_PLAYWRIGHT_MODULE: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:google-auth
      - run: npm run test:google-auth:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-auth-browser-evidence
          path: artifacts/google-auth/
          retention-days: 14
  google-gotrue-linking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the pinned Supabase CLI from its official release asset
        shell: bash
        run: |
          set -euo pipefail
          cli_dir="$(mktemp -d "$RUNNER_TEMP/pazo-supabase-cli.XXXXXX")"
          cd "$cli_dir"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --max-time 90 --retry-max-time 180 \
            --header 'Accept: application/octet-stream' \
            --output supabase.tar.gz 'https://api.github.com/repos/supabase/cli/releases/assets/376336010?download=1'
          echo '2938de97c4ee1d15de4affe9bfdac3dd665bc57d264f69101482133798f40e0a  supabase.tar.gz' | sha256sum --check
          tar -xzf supabase.tar.gz supabase
          test "$(./supabase --version)" = '2.81.3'
          echo "$cli_dir" >> "$GITHUB_PATH"
      - name: Prepare a disposable Auth stack; no linked project or hosted credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pazo-google-lab"
          cd "$RUNNER_TEMP/pazo-google-lab"
          supabase init
          python3 - <<'PY'
          from pathlib import Path
          import re
          config=Path('supabase/config.toml')
          data=config.read_text()
          data=re.sub(r'^project_id\s*=.*$','project_id = "pazo-google-lab"',data,count=1,flags=re.M)
          data,count=re.subn(r'^enable_confirmations\s*=\s*false\s*$','enable_confirmations = true',data,count=1,flags=re.M)
          assert count==1,'Email confirmation must be enabled, as in the hosted project'
          data,count=re.subn(r'^additional_redirect_urls\s*=.*$','additional_redirect_urls = ["http://127.0.0.1:5398/?auth=google"]',data,count=1,flags=re.M)
          assert count==1
          data+='''
          [auth.external.keycloak]
          enabled = true
          client_id = "synthetic-client"
          secret = "synthetic-not-a-secret"
          url = "http://172.17.0.1:54399/realms/lab"
          '''.replace('          ','')
          config.write_text(data)
          PY
          supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          umask 077
          supabase status -o json > "$RUNNER_TEMP/pazo-google-lab/status.json"
      - run: node scripts/google-auth-gotrue-lab.mjs "$RUNNER_TEMP/pazo-google-lab/status.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-auth-gotrue-evidence
          path: artifacts/google-auth/
          retention-days: 14
      - name: Discard all synthetic data
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/pazo-google-lab" && supabase stop --no-backup || true
