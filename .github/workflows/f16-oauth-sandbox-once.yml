name: F16 Inert v10 HTTP One-Time
on:
  pull_request:
    branches: [release/mvp-beta-fast-track-20261010]
permissions:
  contents: read
jobs:
  verify-restored-inert-f16:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify restored v10 GET and POST reject webhooks without any credentials
        shell: bash
        run: |
          set -euo pipefail
          url='https://mrybvqdebbgcayuvgkkr.supabase.co/functions/v1/f16-paypal-webhook'
          for method in GET POST; do
            body="$RUNNER_TEMP/restored-v10-$method.json"
            status=$(curl --silent --show-error --retry 0 --max-time 15 --request "$method" \
              --output "$body" --write-out '%{http_code}' "$url")
            test "$status" = '503' || { echo "FAIL: $method HTTP $status"; exit 1; }
            node -e 'const fs=require("node:fs");const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(j.code!=="f16_receiver_not_released")process.exit(1)' "$body"
            echo "PASS restored F16 v10 $method: HTTP 503 f16_receiver_not_released"
          done
