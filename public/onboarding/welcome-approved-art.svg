<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 239" width="720" height="478" role="presentation">
  <!-- The exact PO-approved corgi and foliage in a single intact frame.
       No separate mouth/head/tail overlays, clipping or visible seams. -->
  <defs>
    <linearGradient id="fadeEdges" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="8%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="dogImageFade"><rect width="360" height="239" fill="url(#fadeEdges)"/></mask>
  </defs>
  <image x="0" y="0" width="360" height="239" preserveAspectRatio="xMidYMid meet"
    mask="url(#dogImageFade)" href="data:image/webp;base64,"/>
</svg>
